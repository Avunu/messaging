[project]
name = "messaging"
authors = [{ name = "Avunu LLC", email = "mail@avu.nu" }]
description = "Messaging functionality for Frappe Sites"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "MIT" }
classifiers = ["License :: OSI Approved :: MIT License"]
dynamic = ["version"]
dependencies = ["phonenumbers", "pywebpush", "twilio"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0,<17.0.0"
newsletter = ">=0.0.1,<1.0.0"

[tool.frappe-nix]
schema = 1
profile = "github:Avunu/frappe-standards-profile/main"
frappe-major = 16
siblings = ["newsletter"]
integration-branch = "main"
# vue-advanced-chat's source, committed unchanged from upstream (see its README.md): kept out of
# formatting and linting so it stays byte-identical to the release it was copied from.
generated = ["vendor/**"]

# required_apps names frappe/newsletter by its bare app name. Its version-16 branch is versioned
# 0.0.x, not with the Frappe major, so the generic rule's range would not match it.
[tool.frappe-nix.known-apps.newsletter]
repo = "frappe/newsletter"
branch = "version-{n}"
range = ">=0.0.1,<1.0.0"

# docs.yml calls Avunu/site-docs' shared check. Its pin gets its own needs-review Dependabot
# group (a person reads every bump) and skips the cooldown.
[tool.frappe-nix.docs-site]
enable = true
action-patterns = ["Avunu/site-docs*"]
cooldown-exclude-actions = ["Avunu/site-docs"]

[[tool.frappe-nix.typescript.spa]]
root = "."
include = ["messaging/public/js/chat/**"]
tsconfig = "tsconfig.json"
check = "node scripts/vue-tsc.cjs --noEmit -p tsconfig.json"

# Temporary, until the chat code is typed against frappe-types: the managed oxlint rules the
# desk code doesn't meet yet, each per file. Turning off no-explicit-any needs locked-rules = false.
[tool.frappe-nix.js]
locked-rules = false

# `(window as any).frappe?.csrf_token` in two fetch calls, and two `catch (error)` that shadow
# useChat's `error` ref.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["messaging/public/js/chat/ChatView.vue"]
rules = { "typescript/no-explicit-any" = "off", "no-shadow" = "off" }

# Stylesheet imports are side-effect imports by nature: Vite pulls frappe-ui's CSS into the
# bundle in import order. And frappe's CommunicationComposer opens its dialog from its constructor.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["messaging/public/js/chat/bundle.ts"]
rules = { "import/no-unassigned-import" = "off", "no-new" = "off" }

# FileReader's `onload` in the attachment preview.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["messaging/public/js/chat/ChatFooter.vue"]
rules = { "unicorn/prefer-add-event-listener" = "off" }

# A false positive: the service worker calls Client.postMessage(), which has no targetOrigin
# argument (that is Window.postMessage()).
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["messaging/public/js/chat/sw-messaging.js"]
rules = { "unicorn/require-post-message-target-origin" = "off" }

# Frappe's doctype boilerplate, all comments.
[[tool.frappe-nix.js.oxlint.overrides]]
files = ["messaging/messaging/doctype/messaging_group/messaging_group.js"]
rules = { "unicorn/no-empty-file" = "off" }

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"


[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "SIM", "C4", "PIE", "PERF", "T20"]
ignore = [
	"E501", # line too long
	"W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

# Temporary: the maintenance helpers report progress with print() under `bench execute`.
[tool.ruff.lint.per-file-ignores]
"messaging/maintenance.py" = ["T201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["messaging"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
omit = ["*/tests/*", "*/test_*.py", "*/patches/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
precision = 1
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "@(abc\\.)?abstractmethod"]
fail_under = 39

[tool.vulture]
exclude = [".venv/", "node_modules/", ".frappe-nix/", ".dev-dist/", ".devenv/", ".direnv/"]

[tool.test_utils.static-analysis]
whitelist = ["frappe.*", "newsletter.*"]
